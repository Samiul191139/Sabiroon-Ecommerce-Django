{% extends 'store/main.html' %}
{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Product Image -->
        <div class="col-md-6">
            <img src="{{ product.imageURL }}" alt="{{ product.name }}"
                 class="img-fluid rounded shadow-sm" style="max-height:500px; object-fit:cover;">
        </div>

        <!-- Product Info -->
        <div class="col-md-6">
            <h2 class="mb-3" style="font-family: 'Cursive', sans-serif; color:#2C5F2D;">{{ product.name }}</h2>
            <h4 class="text-success mb-4">৳{{ product.price }}</h4>

            <p class="mb-4">{{ product.description }}</p>  <!-- assuming Product has description -->

            <button data-product="{{ product.id }}" data-action="add"
                    class="btn update-cart px-4 py-2"
                    style="background-color:#7BAF9E; color:#fff; border-radius:30px;">
                🛒 Add to Cart
            </button>

            <a href="{% url 'store' %}" class="btn btn-outline-secondary px-4 py-2 rounded-pill ml-2">
                ← Back to Shop
            </a>
        </div>
    </div>
</div>

<style>
    .btn:hover { transform: scale(1.05); transition: 0.2s; }
</style>
{% endblock content %}
